{% extends 'management/base.html' %}
{% load static %}

{% block title %}Edit Program - MIU Admin Portal{% endblock %}

{% block content %}
<link href="{% static 'vendor/select2/select2.min.css' %}" rel="stylesheet">
<style>
  .select2-container { width: 100% !important; }
  .select2-container--default .select2-selection--single {
    height: 42px; border: 1px solid #d1d5db; border-radius: .5rem;
    display: flex; align-items: center; padding: 0 .75rem;
  }
  .select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 42px; color: #111827; font-size: .875rem; padding: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 28px);
  }
  .select2-container--default .select2-selection--single .select2-selection__arrow { height: 42px; right: 10px; }
  .select2-container--default.select2-container--focus .select2-selection--single,
  .select2-container--default.select2-container--open  .select2-selection--single {
    border-color: #3a56d4; box-shadow: 0 0 0 2px rgba(58,86,212,.15); outline: none;
  }
  .select2-dropdown {
    border: 1px solid #d1d5db; border-radius: .5rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); font-size: .875rem;
  }
  .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: #3a56d4; }
  .select2-container--default .select2-search--dropdown .select2-search__field {
    border: 1px solid #d1d5db; border-radius: .375rem;
    padding: .375rem .75rem; font-size: .875rem; outline: none; width: 100%; box-sizing: border-box;
  }
  .select2-selection--single.border-red-400 { border-color: #f87171 !important; }
</style>

<div class="max-w-6xl mx-auto">

  <!-- Breadcrumb -->
  <nav class="flex items-center gap-2 text-sm text-gray-500 mb-6" aria-label="Breadcrumb">
    <a href="{% url 'management:programs_list' %}" class="hover:text-primary-600">Programs</a>
    <i class="fas fa-chevron-right text-xs" aria-hidden="true"></i>
    <span class="text-gray-800 font-medium">Edit: {{ program.name }}</span>
  </nav>

  <form method="post" enctype="multipart/form-data" id="programForm">
    {% csrf_token %}

    {% include 'management/_program_form_fields.html' %}

    <!-- Actions -->
    <div class="flex flex-col sm:flex-row justify-end gap-3 mt-5">
      <a href="{% url 'management:programs_list' %}"
         class="px-5 py-2.5 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 text-sm font-medium text-center">
        Cancel
      </a>
      <button type="submit" id="programSubmitBtn"
              class="px-6 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 text-sm font-medium shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
        <i class="fas fa-save mr-1.5" aria-hidden="true"></i>
        <span id="programSubmitLabel">Save Changes</span>
      </button>
    </div>

  </form>
</div>

<script src="{% static 'vendor/select2/select2.min.js' %}"></script>
<script src="{% static 'js/program_form_admin.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('programForm');
  initProgramFormUI(form);

  const submitBtn = document.getElementById('programSubmitBtn');
  const submitLabel = document.getElementById('programSubmitLabel');
  form.addEventListener('submit', function () {
    if (form.dataset.submitting === 'true') return;
    form.dataset.submitting = 'true';
    submitBtn.disabled = true;
    submitLabel.textContent = 'Saving…';
  });
});
</script>
{% endblock %}
